name: Deploy take-home-calculators to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "take-home-calculators/**"
      - ".github/workflows/deploy-take-home-calculators.yml"
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-deploy]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-take-home-calculators"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: cd take-home-calculators && npm install --legacy-peer-deps

      - name: Build static export
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_PRIVATE_WORKER_COUNT: "1"
        run: cd take-home-calculators && npm run build

      - name: Write CNAME and nojekyll
        run: |
          echo "salarytools.in" > take-home-calculators/out/CNAME
          touch take-home-calculators/out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: take-home-calculators/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
