name: Deploy Take Home Calculators

on:
  push:
    branches: [main]
    paths:
      - "take-home-calculators/**"
      - ".github/workflows/deploy-take-home-calculators.yml"
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-deploy]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: take-home-calculators
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: take-home-calculators
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          NEXT_PUBLIC_BASE_PATH: ""
        run: npm run build

      - name: Add CNAME
        run: echo "salarytools.in" > take-home-calculators/out/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: take-home-calculators/out
          destination_dir: .
          keep_files: false
