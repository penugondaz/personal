name: Deploy Take Home Calculators

on:
  push:
    branches: [main]
    paths:
      - "take-home-calculators/**"
      - ".github/workflows/deploy-take-home-calculators.yml"
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-deploy]

concurrency:
  group: deploy-salarytools
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: take-home-calculators/package-lock.json

      - name: Cache Next.js build output
        uses: actions/cache@v4
        with:
          path: take-home-calculators/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('take-home-calculators/package-lock.json') }}-${{ hashFiles('take-home-calculators/**/*.ts', 'take-home-calculators/**/*.tsx', 'take-home-calculators/**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('take-home-calculators/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        working-directory: take-home-calculators
        run: npm ci

      - name: Build
        working-directory: take-home-calculators
        env:
          NEXT_PUBLIC_BASE_PATH: ""
        run: npm run build

      - name: Add CNAME
        run: echo "salarytools.in" > take-home-calculators/out/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: take-home-calculators/out
          destination_dir: .
          keep_files: false
