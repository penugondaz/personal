# Builds and deploys the take-home-calculators Next.js app to GitHub Pages.
#
# Repo layout assumption: this workflow file lives at the REPO ROOT
# (penugondaz/personal/.github/workflows/deploy-take-home-calculators.yml),
# and the app source lives in the subfolder `take-home-calculators/`.
#
# DEPLOYMENT TARGET:
#   https://penugondaz.github.io/personal/
#
# GitHub Pages serves any repo other than <username>.github.io itself as a
# "project site" at username.github.io/<repo-name>/ — that /personal
# segment is baked into the URL by GitHub regardless of where in the repo
# the app's source lives, and Next.js has no way to know about it unless
# `basePath` says so explicitly. NEXT_PUBLIC_BASE_PATH below must be
# "/personal" for that reason, even though the app itself isn't deployed
# under any further subpath of its own.
#
# IMPORTANT — one-time GitHub Pages setup (Settings > Pages):
#   Source: "GitHub Actions" (not "Deploy from a branch")

name: Deploy take-home-calculators to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "take-home-calculators/**"
      - ".github/workflows/deploy-take-home-calculators.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-take-home-calculators"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: take-home-calculators
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: take-home-calculators/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: "/personal"
        run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/take-home-calculators/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
