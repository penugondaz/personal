# Builds and deploys the take-home-calculators Next.js app to GitHub Pages.
#
# Repo layout assumption: this workflow file lives at the REPO ROOT
# (penugondaz/personal/.github/workflows/deploy-take-home-calculators.yml),
# and the app source lives in the subfolder `take-home-calculators/`.
#
# DEPLOYMENT TARGET: the repo root of the Pages site, i.e.
#   https://penugondaz.github.io/personal/
#
# IMPORTANT — one-time GitHub Pages setup (Settings > Pages):
#   Source: "GitHub Actions" (not "Deploy from a branch")

name: Deploy take-home-calculators to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "take-home-calculators/**"
      - ".github/workflows/deploy-take-home-calculators.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-take-home-calculators"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: take-home-calculators
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: take-home-calculators/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: ""
        run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Debug — inspect out/ before upload
        run: |
          echo "Working directory: $(pwd)"
          echo "--- ls -la out ---"
          ls -la out
          echo "--- file type of out ---"
          file out
          echo "--- recursive tree (first 100 entries) ---"
          find out -maxdepth 3 | head -100
          echo "--- total file count under out/ ---"
          find out -type f | wc -l
          echo "--- _next/static/chunks check ---"
          ls -la out/_next/static/chunks 2>&1 | head -20 || echo "NO _next/static/chunks DIRECTORY FOUND"
          echo "--- GITHUB_WORKSPACE=$GITHUB_WORKSPACE ---"
          ls -la "$GITHUB_WORKSPACE/take-home-calculators" | head -30
          test -d "$GITHUB_WORKSPACE/take-home-calculators/out" && echo "YES, out is a directory" || echo "NO — missing or not a directory"
          find "$GITHUB_WORKSPACE/take-home-calculators/out" -type f | wc -l

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: take-home-calculators/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
